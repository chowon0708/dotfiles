###########
# Window creation / navigation / coordination
###########
bind C-S set-window-option synchronize-panes
bind | split-window -h -c "#{pane_current_path}" 
bind - split-window -v -c "#{pane_current_path}"
bind H previous-window
bind L next-window
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Arrow-key movement -------------------------------------------------
# Shift+arrows move between panes, no prefix. Works with zero terminal setup.
bind -n S-Left  select-pane -L
bind -n S-Right select-pane -R
bind -n S-Up    select-pane -U
bind -n S-Down  select-pane -D

# Option+arrows switch windows, no prefix. Needs "Option as Meta" in Terminal.
bind -n M-Left  previous-window
bind -n M-Right next-window

# Same arrows also work after the prefix, as a fallback that always works.
bind Left  select-pane -L
bind Right select-pane -R
bind Up    select-pane -U
bind Down  select-pane -D
bind -r -T prefix , resize-pane -L 20
bind -r -T prefix . resize-pane -R 20
bind -r -T prefix \\ resize-pane -U 7
bind -r -T prefix "'" resize-pane -D 7

# Ensure truecolor is enabled
set-option -g default-terminal 'screen-256color'
set-option -g terminal-overrides ',xterm-256color:Tc'

###########
# Misc. configs
###########
set -g prefix '`'
unbind C-a
bind '`' send-prefix        # press ` twice for a literal backtick
set -g mouse on                  # scroll wheel, click panes, drag borders
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
set -g default-terminal "${TERM}"
setw -g mode-keys vi

###########
# Plugins
###########
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

###########
# Plugin Configs
###########
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

set -g @catppuccin_flavor "mocha"

# Set left status
set -g status-left-length 100
set -g status-left ""

# Set right status
set -g status-right-length 100
set -g status-right-length 100
set -g status-right ""

# Status bar config
set -g @catppuccin_date_time_text " %H:%M"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_connect_separator "no"

# Window options
set -g @catppuccin_window_status_style "custom"
set -g @catppuccin_window_left_separator "#[bg=default,fg=#{@catppuccin_pane_background_color}]#[none]"
set -g @catppuccin_window_middle_separator " "
set -g @catppuccin_window_right_separator "#[bg=default,fg=#{@catppuccin_window_number_color}]#[bg=none]"
set -g @catppuccin_window_current_left_separator "#[bg=default,fg=#{@catppuccin_window_current_text_color}]#[none]"
set -g @catppuccin_window_current_right_separator "#[bg=default,fg=#{@catppuccin_window_current_number_color}]#[bg=none]"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag, ,}"

# We run tpm twice because the catppuccin bar needs to fill a format string
run '~/.tmux/plugins/tpm/tpm'

source -F "~/.tmux/plugins/tmux/status/ram.conf"

set -ag status-right "#{E:@catppuccin_status_session}"
set -agF status-right "#{E:@catppuccin_status_ram}"
set -agF status-right "#{E:@catppuccin_status_battery}"
set -ag status-right "#{E:@catppuccin_status_date_time}"


run '~/.tmux/plugins/tpm/tpm'

# Make the status line background transparent (not sure why this has to be after tpm)
set -g status-bg default
set -g status-style bg=default
set -g pane-active-border-style 'fg=brightblack, bg=default'
set -g pane-border-style 'fg=brightblack, bg=default'

